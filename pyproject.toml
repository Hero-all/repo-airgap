[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "repo-airgap"
version = "0.1.0"
description = "Local privacy audit and reviewed air-gap adaptation for source repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["airgap", "privacy-audit", "telemetry", "offline-first", "agent-skill", "static-analysis", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pathspec>=0.12,<1", "rich>=13,<15"]

[project.urls]
Homepage = "https://github.com/Hero-all/repo-airgap"
Repository = "https://github.com/Hero-all/repo-airgap.git"
Issues = "https://github.com/Hero-all/repo-airgap/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyyaml>=6,<7", "ruff>=0.11"]
auth = ["Flask>=3,<4"]

[project.scripts]
repo-airgap = "repo_airgap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_airgap"]

[tool.hatch.build.targets.wheel.force-include]
"rules" = "repo_airgap/rules"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

